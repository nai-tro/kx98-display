[project]
name = "kx98-display"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dechmontri Sriboonma (Tro)", email = "dechmontri.s@bankx.co.th" }
]
requires-python = ">=3.12"
dependencies = [
    "hidapi>=0.15.0",
    "pillow>=12.3.0",
]

[project.scripts]
kx98-display = "kx98.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kx98"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
